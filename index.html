<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Genuine Product Verification">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <title>Genuine Product Verification</title>
    <style>
        /* ===== RESET ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* ===== PAGE BACKGROUND ===== */
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
            color: #111827;
        }

        /* ===== MAIN CARD CONTAINER ===== */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 32px 20px 36px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.4s ease-out both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== ARSHIA BRAND LOGO ===== */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
        }

        .brand-logo {
            width: 150px;
            max-width: 60%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* ===== TITLE — Centered, Exact Font & Style ===== */
        .product-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.15rem, 5vw, 1.45rem);
            font-weight: 800;
            color: #111827;
            line-height: 1.38;
            text-align: center;
            margin-bottom: 24px;
            padding: 0 8px;
            letter-spacing: -0.015em;
        }

        /* ===== IMAGE CONTAINER ===== */
        .img-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .product-img {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* ===== ERROR & LOADING STATES ===== */
        .error-state {
            padding: 40px 10px;
            text-align: center;
        }
        .error-icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ef4444;
            margin-bottom: 8px;
        }
        .error-msg {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.6;
        }
        .error-id {
            font-family: monospace;
            background: #f3f4f6;
            padding: 3px 8px;
            border-radius: 6px;
            color: #111827;
            font-weight: 700;
        }

        .loading-state {
            padding: 60px 0;
            color: #9ca3af;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #f3f4f6;
            border-top-color: #111827;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 360px) {
            .card {
                padding: 24px 12px 28px;
            }
            .brand-logo {
                width: 125px;
            }
            .product-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        Verifying product...
    </div>
</div>

<script>
(function () {
    // Built-in fallback database in case fetch is blocked by file:// CORS
    const fallbackProducts = [
        {
            "id": "SM116-2515",
            "name": "Sandwich Maker & Toaster",
            "image": "product image/SM116-2515.jpg"
        },
        {
            "id": "BL014-2720",
            "name": "6-in-1 Multi-Function Blender",
            "image": "product image/BL014-2720.jpg"
        },
        {
            "id": "BL014-2718",
            "name": "6-in-1 Multi-Function Blender",
            "image": "product image/BL014-2718.jpg"
        },
        {
            "id": "VC272-3863-1",
            "name": "6 in 1 vacuum cleaner with mop",
            "image": "product image/VC272-3863-1.webp"
        },
        {
            "id": "VC272-3863",
            "name": "6 in 1 vacuum cleaner with mop",
            "image": "product image/VC272-3863.jpg"
        },
        {
            "id": "CW128-3061",
            "name": "Carpet Washer",
            "image": "product image/CW128-3061.jpg"
        },
        {
            "id": "EM118-2695",
            "name": "Espresso maker",
            "image": "product image/EM118-2695.webp"
        },
        {
            "id": "SM050-3286",
            "name": "Toaster",
            "image": "product image/SM050-3286.jpg"
        }
    ];

    // 1. Read ?id= from URL
    const params = new URLSearchParams(window.location.search);
    const productId = (params.get('id') || '').trim().toUpperCase();

    // 2. Load products (fetch with fallback)
    fetch('products.json')
        .then(r => {
            if (!r.ok) throw new Error('Fetch failed');
            return r.json();
        })
        .then(products => handleProducts(products))
        .catch(() => handleProducts(fallbackProducts));

    function handleProducts(products) {
        if (!productId) {
            if (products.length > 0) {
                renderProduct(products[0]);
            } else {
                renderError(productId);
            }
            return;
        }

        const product = products.find(p => p.id.toUpperCase() === productId);
        if (product) {
            renderProduct(product);
        } else {
            renderError(productId);
        }
    }

    // 3. Render Product
    function renderProduct(p) {
        const card = document.getElementById('card');
        card.innerHTML = `
            <div class="logo-container">
                <img src="arshia logo blue.webp" alt="Arshia" class="brand-logo">
            </div>
            <h1 class="product-title">This Arshia ${escHtml(p.name)} (${escHtml(p.id)}) Is A Genuine Product</h1>
            <div class="img-container">
                <img
                    class="product-img"
                    src="${escHtml(p.image)}"
                    alt="${escHtml(p.name)}"
                    decoding="async"
                >
            </div>
        `;
    }

    // 4. Render Error
    function renderError(id) {
        const card = document.getElementById('card');
        const msg = id
            ? `No product found with ID <span class="error-id">${escHtml(id)}</span>. Please verify the code or contact support.`
            : `No product ID provided. Please scan the QR code on the product.`;

        card.innerHTML = `
            <div class="logo-container">
                <img src="arshia logo blue.webp" alt="Arshia" class="brand-logo">
            </div>
            <div class="error-state">
                <div class="error-icon">&#x26A0;&#xFE0F;</div>
                <p class="error-title">Product Not Found</p>
                <p class="error-msg">${msg}</p>
            </div>
        `;
    }

    // Helper: Escape HTML
    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
})();
</script>

</body>
</html>
