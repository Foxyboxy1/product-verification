<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة طباعة ملصقات الـ QR للمنتجات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --dark: #0f172a;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #f1f5f9;
            color: #1e293b;
            padding: 24px 16px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .header p {
            color: #64748b;
            font-size: 0.95rem;
        }
        .control-panel {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #334155;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }
        .form-group select {
            direction: rtl;
            background: #fff;
            cursor: pointer;
        }
        .form-group input {
            direction: ltr;
        }
        .form-group select:focus, .form-group input:focus {
            border-color: var(--primary);
        }
        .hint {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 6px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
            text-decoration: none;
        }
        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .preview-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .sticker-card {
            background: #ffffff;
            width: 280px;
            border-radius: 18px;
            border: 3px solid #10b981;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
        }
        .sticker-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: #065f46;
            margin-bottom: 4px;
        }
        .sticker-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: #065f46;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sticker-id {
            font-size: 0.8rem;
            font-weight: 800;
            color: #047857;
            background: #ecfdf5;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        .qr-wrapper {
            background: #ffffff;
            display: inline-block;
            padding: 10px;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
            margin-bottom: 10px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
        }
        .sticker-footer {
            font-size: 0.78rem;
            font-weight: 700;
            color: #475569;
            margin-top: 6px;
        }
        .sticker-badge {
            display: inline-block;
            background: #ecfdf5;
            color: #059669;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 20px;
            margin-top: 6px;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .header, .control-panel, .btn-group {
                display: none !important;
            }
            .preview-section {
                margin: 0;
            }
            .sheet-print {
                display: grid !important;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                padding: 20px;
            }
            .sticker-card {
                box-shadow: none !important;
                break-inside: avoid;
            }
        }
        .sheet-print {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-qrcode" style="color: #10b981;"></i> طباعة استيكرات الـ QR للمنتجات</h1>
            <p>اختر المنتج وسيتم إنشاء كود QR مخصص له يفتح صفحة التحقق الخاصة به مباشرة.</p>
        </div>

        <div class="control-panel">
            <div class="form-group">
                <label for="productSelect"><i class="fa-solid fa-box"></i> اختر المنتج المراد طباعة الاستيكر له:</label>
                <select id="productSelect">
                    <option value="SM116-2515" data-name="Sandwich Maker & Toaster">Sandwich Maker & Toaster (SM116-2515)</option>
                    <option value="BL014-2720" data-name="6-in-1 Multi-Function Blender">6-in-1 Multi-Function Blender (BL014-2720)</option>
                    <option value="BL014-2718" data-name="6-in-1 Multi-Function Blender">6-in-1 Multi-Function Blender (BL014-2718)</option>
                    <option value="VC272-3863" data-name="6 in 1 vacuum cleaner with mop">6 in 1 vacuum cleaner with mop (VC272-3863)</option>
                    <option value="VC272-3863-1" data-name="6 in 1 vacuum cleaner with mop">6 in 1 vacuum cleaner with mop (VC272-3863-1)</option>
                    <option value="CW128-3061" data-name="Carpet Washer">Carpet Washer (CW128-3061)</option>
                    <option value="EM118-2695" data-name="Espresso maker">Espresso maker (EM118-2695)</option>
                    <option value="SM050-3286" data-name="Toaster">Toaster (SM050-3286)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pageUrl"><i class="fa-solid fa-link"></i> الرابط المشفر في الـ QR:</label>
                <input type="text" id="pageUrl" readonly>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="downloadSingleBtn">
                    <i class="fa-solid fa-download"></i> تحميل الاستيكر صورة (PNG)
                </button>
                <button class="btn btn-secondary" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> طباعة صفحة ملصقات كاملة (A4)
                </button>
                <a id="previewLink" href="#" target="_blank" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> فتح صفحة المنتج
                </a>
            </div>
        </div>

        <div class="preview-section">
            <div class="sticker-card" id="stickerCard">
                <div class="sticker-header">فحص الضمان والأصالة</div>
                <div class="sticker-title" id="stickerTitle">Sandwich Maker & Toaster</div>
                <div class="sticker-id" id="stickerId">ID: SM116-2515</div>

                <div class="qr-wrapper">
                    <div id="qrcode"></div>
                </div>

                <div class="sticker-footer">امسح الكود بكاميرا هاتفك</div>
                <div class="sticker-badge"><i class="fa-solid fa-check"></i> منتج أصلي 100%</div>
            </div>
        </div>

        <div class="sheet-print" id="printSheet"></div>
    </div>

    <script>
        const baseUrl = "https://foxyboxy1.github.io/product-verification/";
        const productSelect = document.getElementById('productSelect');
        const pageUrlInput = document.getElementById('pageUrl');
        const qrcodeContainer = document.getElementById('qrcode');
        const stickerTitle = document.getElementById('stickerTitle');
        const stickerId = document.getElementById('stickerId');
        const previewLink = document.getElementById('previewLink');
        const downloadSingleBtn = document.getElementById('downloadSingleBtn');
        const printSheet = document.getElementById('printSheet');

        let qrInstance = null;

        function update() {
            const selectedOpt = productSelect.options[productSelect.selectedIndex];
            const id = selectedOpt.value;
            const name = selectedOpt.getAttribute('data-name');
            const fullUrl = baseUrl + "?id=" + encodeURIComponent(id);

            pageUrlInput.value = fullUrl;
            previewLink.href = fullUrl;
            stickerTitle.textContent = "Arshia " + name;
            stickerId.textContent = "(" + id + ")";

            qrcodeContainer.innerHTML = '';
            qrInstance = new QRCode(qrcodeContainer, {
                text: fullUrl,
                width: 170,
                height: 170,
                colorDark: "#065f46",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(preparePrintSheet, 300);
        }

        function preparePrintSheet() {
            printSheet.innerHTML = '';
            const stickerHtml = document.getElementById('stickerCard').outerHTML;
            for (let i = 0; i < 9; i++) {
                printSheet.innerHTML += stickerHtml;
            }
        }

        productSelect.addEventListener('change', update);

        downloadSingleBtn.addEventListener('click', () => {
            const qrCanvas = qrcodeContainer.querySelector('canvas');
            const qrImg = qrcodeContainer.querySelector('img');
            const source = qrCanvas || qrImg;
            if (!source) return;

            const selectedOpt = productSelect.options[productSelect.selectedIndex];
            const id = selectedOpt.value;
            const name = selectedOpt.getAttribute('data-name');

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const w = 500;
            const h = 680;
            canvas.width = w;
            canvas.height = h;

            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            // Border
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#10b981';
            ctx.strokeRect(10, 10, w - 20, h - 20);

            // Texts
            ctx.textAlign = 'center';
            ctx.fillStyle = '#065f46';
            ctx.font = 'bold 20px Cairo, Arial, sans-serif';
            ctx.fillText("فحص الضمان والأصالة", w / 2, 55);

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 22px Cairo, Arial, sans-serif';
            ctx.fillText("Arshia " + name, w / 2, 95);

            ctx.fillStyle = '#059669';
            ctx.font = 'bold 18px Arial, sans-serif';
            ctx.fillText("(" + id + ")", w / 2, 130);

            // Draw QR
            const qrSize = 310;
            const qrX = (w - qrSize) / 2;
            const qrY = 150;
            ctx.drawImage(source, qrX, qrY, qrSize, qrSize);

            // Footer
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 20px Cairo, Arial, sans-serif';
            ctx.fillText("امسح الكود بكاميرا هاتفك", w / 2, 510);

            // Badge
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.roundRect(w / 2 - 140, 540, 280, 55, 28);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px Cairo, Arial, sans-serif';
            ctx.fillText("✔ هذا المنتج أصلي 100%", w / 2, 576);

            const link = document.createElement('a');
            link.download = `QR-${id}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        window.addEventListener('DOMContentLoaded', update);
    </script>
</body>
</html>
